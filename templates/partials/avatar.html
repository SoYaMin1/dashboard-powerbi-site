<span class="avatar{% if size == 'lg' %} avatar-lg{% endif %}" aria-hidden="true">
  {% if u.profile.avatar %}
    <img src="{{ u.profile.avatar.url }}" alt="">
  {% elif u.first_name or u.last_name %}
    {{ u.first_name|first|upper }}{{ u.last_name|first|upper }}
  {% else %}
    {{ u.username|first|upper }}
  {% endif %}
</span>
