{% extends "base.html" %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="card auth-card {% block card_class %}{% endblock %}">
      <div class="text-center mb-4">
        <span class="icon-tile icon-tile-gradient auth-icon">
          <i class="bi {% block auth_icon %}bi-person{% endblock %}" aria-hidden="true"></i>
        </span>
        <h1 class="h3 mb-1">{% block auth_title %}{% endblock %}</h1>
        <p class="text-muted-soft mb-0">{% block auth_subtitle %}{% endblock %}</p>
      </div>
      {% block auth_body %}{% endblock %}
    </div>
  </div>
</section>
{% endblock %}
