# Render Blueprint: веб-сервис Django + бесплатная PostgreSQL
databases:
  - name: adventureworks-db
    plan: free
    region: frankfurt
    databaseName: adventureworks
    user: adventureworks

services:
  - type: web
    name: adventureworks-analytics
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.15"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: adventureworks-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      # Задаются вручную в дашборде Render
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Резервные ссылки на отчёты Power BI
      - key: POWERBI_SALES_URL
        sync: false
      - key: POWERBI_MAP_URL
        sync: false